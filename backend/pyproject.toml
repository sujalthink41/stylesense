[project]
name = "stylesense"
version = "0.1.0"
description = "StyleSense backend: AI fashion stylist API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-instrumentation-redis>=0.66b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.26.0",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentry-sdk>=2.71.0",
    # <2.1 until opentelemetry-instrumentation-sqlalchemy supports 2.1 (guarded by test_tracing_clients).
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "testcontainers[postgres,redis]>=4.15.0",
]

[tool.uv]
package = true

# ---------- ruff ----------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH",
  "ASYNC", "S", "BLE", "T20", "PT", "RUF", "TID", "ERA", "PL", "TRY",
]
ignore = ["TRY003", "PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S105", "S106"]
"alembic/**" = ["ERA001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["stylesense", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["--strict-markers", "--strict-config", "-ra"]
markers = ["integration: needs Docker (real Postgres/Redis via testcontainers)"]
filterwarnings = ["error", "ignore::DeprecationWarning:testcontainers.*"]

# ---------- coverage ----------
[tool.coverage.run]
source = ["stylesense"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", '^\s*\.\.\.$']

# ---------- import-linter ----------
[tool.importlinter]
root_package = "stylesense"

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
  "stylesense.main",
  "stylesense.api",
  "stylesense.bootstrap",
  "(stylesense.modules)",
  "(stylesense.guards)",
  "stylesense.infra",
  "stylesense.platform",
]
