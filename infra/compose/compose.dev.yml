# Local development: publish ports on localhost only and hot-reload the API.
services:
  postgres:
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"]

  redis:
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]

  api:
    # API_BIND=0.0.0.0 exposes the API (only) on your Wi-Fi so a phone running Expo Go can reach it.
    ports: ["${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"]
    environment:
      APP_ENV: local
      PYTHONPATH: /app/src  # mounted source shadows the installed package
    volumes:
      - ../../backend/src:/app/src:ro
    command: ["uvicorn", "stylesense.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/src", "--no-access-log"]

  worker:
    environment:
      APP_ENV: local
      PYTHONPATH: /app/src  # mounted source shadows the installed package (restart to reload)
    volumes:
      - ../../backend/src:/app/src:ro
