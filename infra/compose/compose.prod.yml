# Homelab production: layered on compose.yml (scripts/deploy.sh).
# The API is published on the server's localhost only. The internet reaches it through
# either Tailscale Funnel (no domain needed) or a Cloudflare Tunnel (your own domain):
# both are outbound connections with HTTPS at the edge, so no router ports are opened.
services:
  migrate:
    environment:
      APP_ENV: production

  api:
    environment:
      APP_ENV: production
    restart: always
    ports: ["127.0.0.1:${API_LOCAL_PORT:-8000}:8000"]  # for Tailscale Funnel; never 0.0.0.0

  worker:
    environment:
      APP_ENV: production
    restart: always

  # Public hostname → http://api:8000 is set in the Cloudflare dashboard (Zero Trust → Tunnels).
  tunnel:
    profiles: [cloudflare]  # deploy.sh turns it on when CLOUDFLARE_TUNNEL_TOKEN is set
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2025.8.1}
    restart: always
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 128m } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    networks: [backend]

  # Nightly pg_dump at 02:30 (container TZ), keeping BACKUP_KEEP_DAYS days in ../../backups.
  backup:
    image: pgvector/pgvector:pg18
    restart: always
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ../../backups:/backups
      - ../../scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]
    depends_on:
      postgres: { condition: service_healthy }
    deploy:
      resources: { limits: { memory: 256m } }
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
    networks: [backend]
