# Observability overlay: traces (collector → Tempo), metrics (Prometheus), dashboards (Grafana),
# errors (GlitchTip), uptime (Uptime Kuma). UIs bind to localhost only.
# Usage: make obs-up  (layers on top of compose.yml + compose.dev.yml)

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-glitchtip-env: &glitchtip-env
  DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?set in .env}@glitchtip-postgres:5432/glitchtip
  VALKEY_URL: redis://glitchtip-valkey:6379/0
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set in .env}
  GLITCHTIP_DOMAIN: http://localhost:${GLITCHTIP_HOST_PORT:-8001}
  DEFAULT_FROM_EMAIL: glitchtip@localhost
  EMAIL_URL: consolemail://
  ENABLE_USER_REGISTRATION: "true"  # create the first account, then disable
  CELERY_WORKER_AUTOSCALE: "1,2"

services:
  api:
    environment:
      APP_OTEL_ENABLED: "true"
      APP_OTEL_ENDPOINT: http://otel-collector:4318
      APP_SENTRY_DSN: ${APP_SENTRY_DSN:-}

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on: [tempo]
    deploy:
      resources: { limits: { memory: 256m } }
    logging: *logging
    networks: [backend]

  tempo:
    image: grafana/tempo:2.8.2
    restart: unless-stopped
    command: ["-config.file=/etc/tempo.yaml"]
    user: "0"  # writes to a named volume
    volumes:
      - ../observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempodata:/var/tempo
    deploy:
      resources: { limits: { memory: 512m } }
    logging: *logging
    networks: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"]
    deploy:
      resources: { limits: { memory: 512m } }
    logging: *logging
    networks: [backend]

  grafana:
    image: grafana/grafana:12.1.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"]
    depends_on: [prometheus, tempo]
    deploy:
      resources: { limits: { memory: 256m } }
    logging: *logging
    networks: [backend]

  glitchtip-postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?set in .env}
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtipdb:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [backend]

  glitchtip-valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    logging: *logging
    networks: [backend]

  glitchtip-migrate:
    image: glitchtip/glitchtip:6.2
    command: ["./bin/run-migrate.sh"]
    environment: *glitchtip-env
    depends_on:
      glitchtip-postgres: { condition: service_healthy }
    restart: "no"
    logging: *logging
    networks: [backend]

  glitchtip:
    image: glitchtip/glitchtip:6.2
    restart: unless-stopped
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate: { condition: service_completed_successfully }
      glitchtip-valkey: { condition: service_started }
    ports: ["127.0.0.1:${GLITCHTIP_HOST_PORT:-8001}:8080"]  # v5 serves on 8080
    deploy:
      resources: { limits: { memory: 512m } }
    logging: *logging
    networks: [backend]

  glitchtip-worker:
    image: glitchtip/glitchtip:6.2
    restart: unless-stopped
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *glitchtip-env
    depends_on:
      glitchtip-migrate: { condition: service_completed_successfully }
      glitchtip-valkey: { condition: service_started }
    deploy:
      resources: { limits: { memory: 512m } }
    logging: *logging
    networks: [backend]

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: unless-stopped
    volumes:
      - uptimedata:/app/data
    ports: ["127.0.0.1:${UPTIME_HOST_PORT:-3002}:3001"]
    logging: *logging
    networks: [backend]

volumes:
  tempodata:
  promdata:
  grafanadata:
  glitchtipdb:
  uptimedata:
