# Install: make setup. Run on everything: uv --directory backend run pre-commit run -a
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: (^|/)package-lock\.json$  # generated; reviewed via npm ci, not by eye
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict)
        entry: uv --directory backend run mypy
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: import-linter
        name: architecture layers
        entry: uv --directory backend run lint-imports
        language: system
        pass_filenames: false
        files: ^backend/src/.*\.py$
      - id: uv-lock
        name: uv.lock in sync with pyproject
        entry: uv --directory backend lock --check
        language: system
        pass_filenames: false
        files: ^backend/(pyproject\.toml|uv\.lock)$
